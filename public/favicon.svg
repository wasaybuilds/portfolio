<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon. A W, because that is the name he goes by and the header mark uses.

    Drawn as a stroked path rather than set as text: a favicon has no access to
    the site's webfonts, so type would fall back to whatever the OS supplies
    and render differently on every machine.

    Dark ground with a light mark, so it holds up against both light and dark
    browser chrome — a favicon cannot respond to a theme.

    Deliberately just the letter: at 16px, the size that actually matters, any
    additional detail turns to mud.
  -->
  <rect width="32" height="32" rx="7.5" fill="#16161a"/>
  <path d="M6.5 9.5 11 22.5 16 13.5 21 22.5 25.5 9.5"
        fill="none" stroke="#faf9f7" stroke-width="2.9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
